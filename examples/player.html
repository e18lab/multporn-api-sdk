<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Modern Video Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
      :root {
        --bg: #0f0f0f;
        --fg: #fff;
        --brand: #ff0033;
        --border: rgba(255, 255, 255, 0.12);
        --radius: 12px;
        --transition: 0.25s ease;

        --range-h: 6px;
        --range-bg: rgba(255, 255, 255, 0.18);
        --range-fill: var(--brand);
        --thumb-size: 16px;
        --thumb-bg: #fff;
        --thumb-ring: rgba(255, 0, 51, 0.25);
      }
      * {
        transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      .player-wrapper {
        position: relative;
        background: #000;
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }

      .player {
        position: relative;
        width: 100%;
        height: 0;
        padding-bottom: 56.25%;
        cursor: default;
        outline: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: pan-y;
      }
      .player:focus {
        outline: none;
      }

      video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
        border-radius: var(--radius);
        outline: none;
      }
      video::-webkit-media-controls {
        display: none !important;
      }

      .player:fullscreen,
      .player:-webkit-full-screen {
        width: 100vw;
        height: 100vh;
        padding: 0;
        background: #000;
      }
      .player:fullscreen video,
      .player:-webkit-full-screen video {
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .player:fullscreen .bottom,
      .player:-webkit-full-screen .bottom {
        padding-bottom: max(18px, env(safe-area-inset-bottom));
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        z-index: 5;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.4) 0%,
          transparent 25%,
          transparent 75%,
          rgba(0, 0, 0, 0.7) 100%
        );
      }
      .player.hide-ui .overlay {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s;
      }

      .top {
        padding: 20px;
      }
      .title {
        font-size: 16px;
        font-weight: 600;
        max-width: 75%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
      }

      .center {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .player.playing .center {
        opacity: 0;
      }
      .big-btn {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
        transition: transform var(--transition);
      }
      .big-btn:hover {
        transform: scale(1.05);
      }

      .bottom {
        padding: 18px;
        padding-bottom: calc(18px + env(safe-area-inset-bottom));
        background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, transparent 100%);
      }

      .bar {
        position: relative;
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.2);
        cursor: pointer;
        margin-bottom: 12px;
        touch-action: none;
      }
      .buf,
      .prog {
        position: absolute;
        height: 100%;
        left: 0;
        top: 0;
        width: 0;
      }
      .buf {
        background: rgba(255, 255, 255, 0.35);
      }
      .prog {
        background: var(--brand);
      }
      .thumb {
        position: absolute;
        top: 50%;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #fff;
        transform: translate(-50%, -50%) scale(0);
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
      }
      .bar:hover .thumb,
      .scrubbing .thumb {
        transform: translate(-50%, -50%) scale(1);
      }

      .tt {
        position: absolute;
        bottom: 100%;
        transform: translateX(-50%);
        background: rgba(20, 20, 20, 0.95);
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 12px;
        margin-bottom: 8px;
        white-space: nowrap;
        display: none;
      }
      .bar:hover .tt {
        display: block;
      }

      .preview {
        position: absolute;
        bottom: calc(100% + 8px);
        transform: translateX(-50%);
        width: 160px;
        height: 90px;
        background: #000;
        border-radius: 6px;
        overflow: hidden;
        display: none;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        border: 1px solid var(--border);
      }
      .bar:hover .preview {
        display: block;
      }
      #thumbCanvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .left,
      .right {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .btn {
        position: relative;
        width: 40px;
        height: 40px;
        min-width: 40px;
        border-radius: 50%;
        border: 0;
        background: transparent;
        color: #fff;
        fill: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .btn:hover {
        background: rgba(255, 255, 255, 0.12);
      }

      .time {
        font-variant-numeric: tabular-nums;
        font-size: 14px;
        font-weight: 500;
        text-align: center;
        width: fit-content;
        padding: 0 0px;
        border-radius: 30px;
        cursor: auto;
      }
      .time:hover {
        padding: 0 20px;
      }

      input[type='range'] {
        cursor: pointer;
        appearance: none;
        width: 100%;
        height: var(--range-h);
        border-radius: 999px;
        background:
          linear-gradient(var(--range-fill) 0 0) 0 / var(--_p, 0%) 100% no-repeat,
          var(--range-bg);
        accent-color: var(--range-fill);
        outline: none;
      }
      input[type='range']::-webkit-slider-runnable-track {
        height: var(--range-h);
        border-radius: 999px;
        background: transparent;
      }
      input[type='range']::-webkit-slider-thumb {
        appearance: none;
        width: var(--thumb-size);
        height: var(--thumb-size);
        border-radius: 50%;
        background: var(--thumb-bg);
        border: 2px solid rgba(255, 255, 255, 0.75);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        cursor: pointer;
        margin-top: calc((var(--range-h) - var(--thumb-size)) / 2);
      }
      input[type='range']::-moz-range-track {
        height: var(--range-h);
        border-radius: 999px;
        background: var(--range-bg);
      }
      input[type='range']::-moz-range-progress {
        height: var(--range-h);
        border-radius: 999px;
        background: var(--range-fill);
      }
      input[type='range']::-moz-range-thumb {
        width: var(--thumb-size);
        height: var(--thumb-size);
        border-radius: 50%;
        background: var(--thumb-bg);
        border: 2px solid rgba(255, 255, 255, 0.75);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        cursor: pointer;
      }
      input[type='range']:focus-visible::-webkit-slider-thumb {
        box-shadow: 0 0 0 8px var(--thumb-ring);
        border-color: var(--brand);
      }
      input[type='range']:focus-visible::-moz-range-thumb {
        box-shadow: 0 0 0 8px var(--thumb-ring);
        border-color: var(--brand);
      }

      .vol {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .vol input[type='range'] {
        --range-h: 6px;
        --thumb-size: 14px;
        max-width: 0;
        opacity: 0;
        transition:
          max-width 0.2s,
          opacity 0.2s;
      }
      .vol:focus-within input[type='range'],
      .vol:hover input[type='range'] {
        max-width: 120px;
        opacity: 1;
      }

      #rateSlider {
        --range-h: 8px;
        --thumb-size: 18px;
        max-width: 240px;
      }

      .menu {
        position: relative;
      }
      .dropdown {
        position: absolute;
        right: 0;
        bottom: 48px;
        background: #101010e0;
        border-radius: 10px;
        min-width: 240px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        display: none;
        overflow: hidden;
        padding: 8px 0;
      }
      .dropdown.open {
        display: block;
      }
      .opt {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 14px;
      }
      .opt:hover {
        background: #8484844f;
      }
      .val {
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 12px;
        background: rgba(255, 255, 255, 0.08);
      }

      .qbadge {
        position: absolute;
        right: 2px;
        bottom: 2px;
        font-size: 10px;
        line-height: 1;
        padding: 2px 6px;
        border-radius: 6px;
        background: #222;
        color: #fff;
        display: none;
        pointer-events: none;
      }
      .qbadge.sd {
        background: #666;
        display: inline-block;
      }
      .qbadge.hd {
        background: #3a8cff;
        display: inline-block;
      }
      .qbadge.u4k {
        background: #8a2be2;
        display: inline-block;
      }

      svg {
        display: flex;
      }

      @media (max-width: 500px) {
        .time {
          min-width: 92px;
          font-size: 12px;
        }
        .bottom {
          padding: 0px;
          padding-bottom: 14px;
        }
        .big-btn {
          width: 70px;
          height: 70px;
        }
      }

      @media (max-width: 450px) {
        .vol {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="player-wrapper">
        <div id="player" class="player" tabindex="0" aria-label="Video player area">
          <video id="video" preload="metadata" playsinline crossorigin="anonymous"></video>

          <div class="overlay" id="overlay">
            <div class="top"><div id="title" class="title">Video</div></div>

            <div class="center">
              <div id="big" class="big-btn">
                <svg
                  width="58"
                  height="58"
                  viewBox="0 0 58 58"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M19.3333 16.4817V41.5184C19.3333 43.4275 21.4358 44.5875 23.0549 43.5484L42.7266 31.03C44.2249 30.0875 44.2249 27.9125 42.7266 26.9459L23.0549 14.4517C21.4358 13.4125 19.3333 14.5725 19.3333 16.4817Z"
                    fill="white"
                  />
                </svg>
              </div>
            </div>

            <div class="bottom">
              <div id="bar" class="bar" role="slider" aria-label="Скраббер">
                <div id="buf" class="buf"></div>
                <div id="prog" class="prog"></div>
                <div id="thumb" class="thumb"></div>
                <div id="preview" class="preview">
                  <canvas id="thumbCanvas" width="160" height="90"></canvas>
                </div>
                <div id="tt" class="tt">00:00</div>
              </div>

              <div class="row">
                <div class="left">
                  <button id="play" class="btn" aria-label="Play/Pause">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path d="M8 5v14l11-7z" /></svg>
                  </button>

                  <div id="volWrap" class="vol">
                    <button id="mute" class="btn" aria-label="Mute">
                      <svg id="muteIcon" viewBox="0 0 24 24" width="24" height="24">
                        <path
                          d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"
                        />
                      </svg>
                    </button>
                    <input id="vol" type="range" min="0" max="1" step="0.01" value="1" />
                  </div>

                  <div id="time" class="time btn">00:00 / 00:00</div>
                </div>

                <div class="right">
                  <div class="menu">
                    <button id="menuBtn" class="btn" aria-label="Settings">
                      <svg viewBox="0 0 24 24" width="24" height="24">
                        <path
                          d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.05-.24-.24-.41-.48-.41h-3.84c-.24 0-.44.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22-.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"
                        ></path>
                      </svg>
                      <span id="qbadge" class="qbadge sd">SD</span>
                    </button>
                    <div id="menu" class="dropdown">
                      <div
                        class="opt"
                        style="flex-direction: column; align-items: stretch; gap: 8px"
                      >
                        <div
                          style="display: flex; justify-content: space-between; align-items: center"
                        >
                          <span>Скорость</span><span id="rateVal" class="val">1.00×</span>
                        </div>
                        <input
                          id="rateSlider"
                          type="range"
                          min="0.25"
                          max="2.5"
                          step="0.05"
                          value="1"
                        />
                      </div>
                      <div class="opt" id="loopOpt">
                        <span>Повтор</span><span id="loopVal" class="val">Выкл</span>
                      </div>
                    </div>
                  </div>

                  <button id="pip" class="btn" aria-label="Picture in Picture">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                      <path
                        d="M19 7h-8v6h8V7zm2-4H3c-1.1 0-2 .9-2 2v14c0 1.1.9 1.98 2 1.98h18c1.1 0 2-.88 2-1.98V5c-1.1 0-2-.9-2-2zm0 16.01H3V4.98h18v14.03z"
                      />
                    </svg>
                  </button>
                  <button id="fs" class="btn" aria-label="Fullscreen">
                    <svg id="fsIcon" viewBox="0 0 24 24" width="24" height="24">
                      <path
                        d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"
                      />
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div
            id="osd"
            class="osd"
            style="
              position: absolute;
              left: 50%;
              top: 50%;
              transform: translate(-50%, -50%);
              background: rgba(30, 30, 30, 0.9);
              padding: 10px 14px;
              border-radius: 8px;
              opacity: 0;
              pointer-events: none;
              transition: opacity 0.2s;
              font-size: 16px;
              z-index: 8;
            "
          ></div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const qs = new URLSearchParams(location.search);
        const title = qs.get('title') || 'Video';
        const poster = qs.get('poster') || '';
        const directSrc = qs.get('src') || '';
        const sourcesParam = qs.get('sources') || '';
        const ACCEL_RATE = parseFloat(qs.get('accel') || '2') || 2;
        const HOLD_DELAY_MS = parseInt(qs.get('accelDelay') || '1000', 10);

        const player = document.getElementById('player');
        const video = document.getElementById('video');
        const big = document.getElementById('big');
        const titleEl = document.getElementById('title');
        const timeEl = document.getElementById('time');
        const bar = document.getElementById('bar');
        const buf = document.getElementById('buf');
        const prog = document.getElementById('prog');
        const thumb = document.getElementById('thumb');
        const tt = document.getElementById('tt');
        const previewBox = document.getElementById('preview');
        const previewCanvas = document.getElementById('thumbCanvas');
        const pctx = previewCanvas.getContext('2d');

        const play = document.getElementById('play');
        const mute = document.getElementById('mute');
        const vol = document.getElementById('vol');
        const volWrap = document.getElementById('volWrap');

        const menuBtn = document.getElementById('menuBtn');
        const menu = document.getElementById('menu');
        const loopOpt = document.getElementById('loopOpt');
        const loopVal = document.getElementById('loopVal');
        const rateSlider = document.getElementById('rateSlider');
        const rateVal = document.getElementById('rateVal');
        const qbadge = document.getElementById('qbadge');

        const pip = document.getElementById('pip');
        const fs = document.getElementById('fs');
        const fsIcon = document.getElementById('fsIcon');
        const osd = document.getElementById('osd');

        let isPlaying = false,
          isScrubbing = false;

        let uiSuppress = 0;
        function suppressUI(ms) {
          uiSuppress = Math.max(uiSuppress, performance.now() + ms);
        }
        function uiSuppressed() {
          return performance.now() < uiSuppress;
        }

        let blockTapUntil = 0;
        const CLICK_SUPPRESS_MS = 450;
        const MOVE_TOL = 8;
        function blockClicksShortly() {
          blockTapUntil = performance.now() + CLICK_SUPPRESS_MS;
        }
        function shouldBlockClick() {
          return performance.now() < blockTapUntil;
        }

        function isControlTarget(t) {
          return (
            t.closest('.btn') ||
            t.closest('.big-btn') ||
            t.closest('.bar') ||
            t.closest('.dropdown') ||
            t.closest('.vol') ||
            t.closest('.menu')
          );
        }

        let savedRate = 1,
          downAt = 0,
          holdTimer = null,
          spaceTimer = null,
          spaceAccelerated = false;

        let mainHls = null,
          previewHls = null;
        const previewVideo = document.createElement('video');
        previewVideo.muted = true;
        previewVideo.playsInline = true;
        previewVideo.crossOrigin = 'anonymous';
        previewVideo.preload = 'auto';
        let previewReady = false,
          previewDisabled = false,
          previewSeekReq = 0;

        function parseSources(s) {
          if (!s) return [];
          return s
            .split('|')
            .map((pair) => {
              const [labelEnc, urlEnc] = pair.split(',');
              const label = decodeURIComponent(labelEnc || '').trim() || 'source';
              const url = decodeURIComponent(urlEnc || '').trim();
              return url ? { label, url } : null;
            })
            .filter(Boolean);
        }

        titleEl.textContent = title;
        if (poster) video.poster = poster;

        let sources = parseSources(sourcesParam);
        if (directSrc && !sources.length) sources = [{ label: 'source', url: directSrc }];

        function detachHls(hls) {
          if (hls) {
            try {
              hls.destroy();
            } catch {}
          }
        }
        function attachSrcTo(videoEl, url, isPreview) {
          const isHls = /\.m3u8($|\?)/i.test(url);
          if (window.Hls && Hls.isSupported() && isHls) {
            const hls = new Hls({ maxBufferLength: 30 });
            hls.loadSource(url);
            hls.attachMedia(videoEl);
            if (!isPreview) mainHls = hls;
            else previewHls = hls;
            return hls;
          } else {
            videoEl.src = url;
            return null;
          }
        }
        function setSource(url) {
          detachHls(mainHls);
          detachHls(previewHls);
          attachSrcTo(video, url, false);
          attachSrcTo(previewVideo, url, true);
          previewReady = false;
          previewDisabled = false;

          if (mainHls) {
            mainHls.on(Hls.Events.MANIFEST_PARSED, () => computeBadgeFromHls(mainHls));
          } else {
            video.addEventListener(
              'loadedmetadata',
              once(() => setBadge(qualityFromHeight(video.videoHeight))),
            );
          }
        }

        if (sources.length) setSource(sources[0].url);
        else
          setSource(
            'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',
          );

        const BIG_PLAY_SVG =
          '<svg width="58" height="58" viewBox="0 0 58 58" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M19.3333 16.4817V41.5184C19.3333 43.4275 21.4358 44.5875 23.0549 43.5484L42.7266 31.03C44.2249 30.0875 44.2249 27.9125 42.7266 26.9459L23.0549 14.4517C21.4358 13.4125 19.3333 14.5725 19.3333 16.4817Z" fill="white"/></svg>';
        const BIG_PAUSE_SVG =
          '<svg width="58" height="58" viewBox="0 0 58 58" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M19.3333 45.9167C21.9917 45.9167 24.1667 43.7417 24.1667 41.0834V16.9167C24.1667 14.2584 21.9917 12.0834 19.3333 12.0834C16.675 12.0834 14.5 14.2584 14.5 16.9167V41.0834C14.5 43.7417 16.675 45.9167 19.3333 45.9167ZM33.8333 16.9167V41.0834C33.8333 43.7417 36.0083 45.9167 38.6667 45.9167C41.325 45.9167 43.5 43.7417 43.5 41.0834V16.9167C43.5 14.2584 41.325 12.0834 38.6667 12.0834C36.0083 12.0834 33.8333 14.2584 33.8333 16.9167Z" fill="white"/></svg>';

        function once(fn) {
          let ran = false;
          return function (e) {
            if (ran) return;
            ran = true;
            fn(e);
          };
        }

        function fmt(t) {
          t = Math.max(0, t || 0);
          const h = Math.floor(t / 3600),
            m = Math.floor((t % 3600) / 60),
            s = Math.floor(t % 60);
          return h > 0
            ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`
            : `${m}:${String(s).padStart(2, '0')}`;
        }
        function showOSD(msg, ms = 800) {
          osd.textContent = msg;
          osd.style.opacity = 1;
          setTimeout(() => (osd.style.opacity = 0), ms);
        }
        function updatePlayButtons() {
          play.innerHTML = isPlaying
            ? '<svg viewBox="0 0 24 24" width="24" height="24"><path d="M8 19c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2s-2 .9-2 2v10c0 1.1.9 2 2 2zm8-12c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2s2-.9 2-2V9c0-1.1-.9-2-2-2z"/></svg>'
            : '<svg viewBox="0 0 24 24" width="24" height="24"><path d="M8 5v14l11-7z"/></svg>';
          big.innerHTML = isPlaying ? BIG_PAUSE_SVG : BIG_PLAY_SVG;
          player.classList.toggle('playing', isPlaying);
        }
        function updateMuteUI() {
          const icon = document.getElementById('muteIcon');
          icon.innerHTML =
            video.muted || video.volume === 0
              ? '<path d="M4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3z"/>'
              : '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>';
        }

        function scheduleHide() {
          if (!isPlaying) return;
          if (uiSuppressed()) return;
          clearTimeout(scheduleHide._t);
          scheduleHide._t = setTimeout(() => {
            if (!uiSuppressed() && isPlaying) player.classList.add('hide-ui');
          }, 2000);
        }
        function showUI() {
          if (uiSuppressed()) return;
          player.classList.remove('hide-ui');
          scheduleHide();
        }

        function setRate(r) {
          video.playbackRate = r;
          rateVal.textContent = r.toFixed(2) + '×';
        }

        function posToTime(e) {
          const rect = bar.getBoundingClientRect();
          const x = Math.min(Math.max((e.clientX || 0) - rect.left, 0), rect.width);
          const pct = rect.width ? x / rect.width : 0;
          return { time: pct * (video.duration || 0), pct };
        }
        function applyScrub(pct) {
          prog.style.width = pct * 100 + '%';
          thumb.style.left = pct * 100 + '%';
        }

        function togglePlay() {
          video.paused ? video.play().catch(() => {}) : video.pause();
        }
        function toggleMute() {
          video.muted = !video.muted;
          updateMuteUI();
        }
        function toggleFS() {
          const d = document;
          if (!(d.fullscreenElement || d.webkitFullscreenElement)) {
            const open =
              player.requestFullscreen ||
              player.webkitRequestFullscreen ||
              player.msRequestFullscreen;
            if (open) open.call(player);
            else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
            fsIcon.innerHTML =
              '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>';
          } else {
            const close = d.exitFullscreen || d.webkitExitFullscreen || d.msExitFullscreen;
            if (close) close.call(d);
            else if (video.webkitExitFullscreen) video.webkitExitFullscreen();
            fsIcon.innerHTML =
              '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>';
          }
        }

        function qualityFromHeight(h) {
          if (!h) return 'SD';
          if (h >= 2160) return '4K';
          if (h >= 720) return 'HD';
          return 'SD';
        }
        function setBadge(q) {
          qbadge.classList.remove('sd', 'hd', 'u4k');
          if (q === '4K') {
            qbadge.textContent = '4K';
            qbadge.classList.add('u4k');
          } else if (q === 'HD') {
            qbadge.textContent = 'HD';
            qbadge.classList.add('hd');
          } else {
            qbadge.textContent = 'SD';
            qbadge.classList.add('sd');
          }
        }
        function computeBadgeFromHls(hls) {
          try {
            const maxH = (hls?.levels || []).reduce((m, l) => Math.max(m, l.height || 0), 0);
            setBadge(qualityFromHeight(maxH));
          } catch {}
        }

        function drawPreview() {
          if (!previewReady || previewDisabled) return;
          try {
            const vw = previewVideo.videoWidth || 16,
              vh = previewVideo.videoHeight || 9;
            const ratio = Math.min(previewCanvas.width / vw, previewCanvas.height / vh);
            const dw = Math.max(1, Math.floor(vw * ratio)),
              dh = Math.max(1, Math.floor(vh * ratio));
            const dx = Math.floor((previewCanvas.width - dw) / 2),
              dy = Math.floor((previewCanvas.height - dh) / 2);
            pctx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
            pctx.drawImage(previewVideo, dx, dy, dw, dh);
          } catch {
            previewDisabled = true;
            previewBox.style.display = 'none';
          }
        }
        function queuePreviewSeek(t) {
          if (previewDisabled || !previewReady) return;
          previewSeekReq++;
          const id = previewSeekReq;
          previewVideo.currentTime = Math.min(Math.max(t, 0), previewVideo.duration || t);
          const onSeeked = () => {
            if (id === previewSeekReq) drawPreview();
            previewVideo.removeEventListener('seeked', onSeeked);
          };
          previewVideo.addEventListener('seeked', onSeeked);
        }

        function updateRangeFill(el) {
          const min = +el.min || 0,
            max = +el.max || 100,
            val = +el.value || 0;
          const pct = ((val - min) * 100) / (max - min);
          el.style.setProperty('--_p', pct + '%');
        }

        video.addEventListener('loadedmetadata', () => {
          timeEl.textContent = `${fmt(video.currentTime)} / ${fmt(video.duration)}`;
          if (!mainHls) setBadge(qualityFromHeight(video.videoHeight));
        });
        video.addEventListener('play', () => {
          isPlaying = true;
          updatePlayButtons();
          scheduleHide();
        });
        video.addEventListener('pause', () => {
          isPlaying = false;
          updatePlayButtons();
          player.classList.remove('hide-ui');
          clearTimeout(scheduleHide._t);
        });
        video.addEventListener('timeupdate', () => {
          const d = video.duration || 0;
          if (d) {
            const pct = video.currentTime / d;
            prog.style.width = pct * 100 + '%';
            thumb.style.left = pct * 100 + '%';
            timeEl.textContent = `${fmt(video.currentTime)} / ${fmt(d)}`;
          }
        });
        video.addEventListener('progress', () => {
          try {
            if (video.buffered.length) {
              const end = video.buffered.end(video.buffered.length - 1);
              const pct = video.duration ? end / video.duration : 0;
              buf.style.width = pct * 100 + '%';
            }
          } catch {}
        });

        if (mainHls) mainHls.on(Hls.Events.MANIFEST_PARSED, () => computeBadgeFromHls(mainHls));
        previewVideo.addEventListener('loadedmetadata', () => {
          previewReady = true;
        });
        if (previewHls)
          previewHls.on(Hls.Events.MANIFEST_PARSED, () => {
            previewReady = true;
          });

        bar.addEventListener('pointerdown', (e) => {
          isScrubbing = true;
          player.classList.add('scrubbing');
          const { time, pct } = posToTime(e);
          applyScrub(pct);
          tt.style.left = pct * 100 + '%';
          tt.textContent = fmt(time);
          previewBox.style.left = pct * 100 + '%';
          queuePreviewSeek(time);
          video.currentTime = time;
          e.preventDefault();

          const onMove = (ev) => {
            const { time, pct } = posToTime(ev);
            applyScrub(pct);
            tt.textContent = fmt(time);
            tt.style.left = pct * 100 + '%';
            previewBox.style.left = pct * 100 + '%';
            queuePreviewSeek(time);
            video.currentTime = time;
          };
          const onUp = () => {
            isScrubbing = false;
            player.classList.remove('scrubbing');
            window.removeEventListener('pointermove', onMove);
            blockClicksShortly();
            scheduleHide();
          };
          window.addEventListener('pointermove', onMove);
          window.addEventListener('pointerup', onUp, { once: true });
          showUI();
        });
        bar.addEventListener('mousemove', (e) => {
          const { time, pct } = posToTime(e);
          tt.textContent = fmt(time);
          tt.style.left = pct * 100 + '%';
          previewBox.style.left = pct * 100 + '%';
          queuePreviewSeek(time);
        });

        player.addEventListener('pointerdown', (e) => {
          if (e.pointerType !== 'mouse') return;
          if (isControlTarget(e.target)) return;

          downAt = performance.now();
          savedRate = video.playbackRate || 1;
          let accelerated = false;
          holdTimer = setTimeout(() => {
            accelerated = true;
            video.playbackRate = Math.min((savedRate || 1) * ACCEL_RATE, 4);
            showOSD('>> ' + video.playbackRate.toFixed(2) + '×', 300);
            suppressUI(800);
          }, HOLD_DELAY_MS);

          const end = () => {
            clearTimeout(holdTimer);
            const dt = performance.now() - downAt;
            if (!accelerated && dt < 180 && !isControlTarget(e.target)) togglePlay();
            else if (accelerated) {
              video.playbackRate = savedRate || 1;
              suppressUI(400);
            }
            window.removeEventListener('pointerup', end);
            window.removeEventListener('pointercancel', end);
            window.removeEventListener('blur', end);
          };
          window.addEventListener('pointerup', end);
          window.addEventListener('pointercancel', end);
          window.addEventListener('blur', end);
        });

        big.addEventListener('pointerdown', (e) => e.stopPropagation());
        big.addEventListener('click', (e) => {
          if (shouldBlockClick()) {
            e.stopPropagation();
            e.preventDefault();
            return;
          }
          e.stopPropagation();
          togglePlay();
        });

        const DOUBLE_TAP_MS = 280,
          SEEK_STEP = 10;
        let lastTapTime = 0,
          tapTimeout = null,
          holdActive = false,
          sx = 0,
          sy = 0,
          touchMoved = false;

        function cancelHold() {
          clearTimeout(holdTimer);
          if (holdActive) {
            video.playbackRate = savedRate || 1;
            holdActive = false;
            suppressUI(300);
          }
        }

        player.addEventListener(
          'touchstart',
          (e) => {
            if (isControlTarget(e.target)) return;
            savedRate = video.playbackRate || 1;
            touchMoved = false;
            const t = e.changedTouches[0];
            sx = t.clientX;
            sy = t.clientY;

            if (isPlaying) {
              holdTimer = setTimeout(() => {
                holdActive = true;
                video.playbackRate = Math.min((savedRate || 1) * ACCEL_RATE, 4);
                showOSD('>> ' + video.playbackRate.toFixed(2) + '×', 300);
                suppressUI(1000);
              }, HOLD_DELAY_MS);
            }
          },
          { passive: true },
        );

        player.addEventListener(
          'touchmove',
          (e) => {
            if (isControlTarget(e.target)) return;
            const t = e.changedTouches[0];
            if (Math.abs(t.clientX - sx) > MOVE_TOL || Math.abs(t.clientY - sy) > MOVE_TOL) {
              touchMoved = true;
              cancelHold();
            }
          },
          { passive: true },
        );

        player.addEventListener(
          'touchcancel',
          () => {
            cancelHold();
            blockClicksShortly();
          },
          { passive: true },
        );

        player.addEventListener(
          'touchend',
          (e) => {
            if (isControlTarget(e.target)) {
              blockClicksShortly();
              return;
            }
            const wasHeld = holdActive;
            cancelHold();
            if (wasHeld || touchMoved) {
              blockClicksShortly();
              return;
            }

            const now = Date.now();
            const rect = player.getBoundingClientRect();
            const x = e.changedTouches[0].clientX - rect.left,
              w = rect.width;

            if (now - lastTapTime < DOUBLE_TAP_MS) {
              clearTimeout(tapTimeout);
              if (x < w * 0.4) {
                video.currentTime = Math.max(0, video.currentTime - SEEK_STEP);
                showOSD('⏪ -' + SEEK_STEP + ' сек');
              } else if (x > w * 0.6) {
                video.currentTime = Math.min(video.duration || 0, video.currentTime + SEEK_STEP);
                showOSD('⏩ +' + SEEK_STEP + ' сек');
              } else {
                togglePlay();
              }
              lastTapTime = 0;
              suppressUI(800);
              blockClicksShortly();
            } else {
              lastTapTime = now;
              tapTimeout = setTimeout(() => {
                togglePlay();
                lastTapTime = 0;
              }, DOUBLE_TAP_MS);
            }
          },
          { passive: true },
        );

        player.addEventListener(
          'click',
          (e) => {
            if (shouldBlockClick() && !isControlTarget(e.target)) {
              e.stopPropagation();
              e.preventDefault();
            }
          },
          true,
        );

        let spaceDownAt = 0;
        document.addEventListener('keydown', (e) => {
          if (e.target && /input|textarea|select/.test(e.target.tagName.toLowerCase())) return;
          if (e.key === ' ') {
            e.preventDefault();
            if (spaceDownAt === 0) {
              spaceDownAt = performance.now();
              savedRate = video.playbackRate || 1;
              spaceAccelerated = false;
              spaceTimer = setTimeout(() => {
                spaceAccelerated = true;
                video.playbackRate = Math.min((savedRate || 1) * ACCEL_RATE, 4);
                showOSD('>> ' + video.playbackRate.toFixed(2) + '×', 300);
                suppressUI(800);
              }, HOLD_DELAY_MS);
            }
          } else if (e.key.toLowerCase() === 'f') {
            e.preventDefault();
            toggleFS();
          } else if (e.key.toLowerCase() === 'm') {
            e.preventDefault();
            toggleMute();
          } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            video.currentTime = Math.max(0, video.currentTime - 5);
            showOSD('-5 сек');
          } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            video.currentTime = Math.min(video.duration || 0, video.currentTime + 5);
            showOSD('+5 сек');
          }
        });
        document.addEventListener('keyup', (e) => {
          if (e.key === ' ') {
            clearTimeout(spaceTimer);
            const dt = performance.now() - spaceDownAt;
            if (spaceAccelerated) {
              video.playbackRate = savedRate || 1;
              suppressUI(300);
            }
            if (dt < 180) togglePlay();
            spaceDownAt = 0;
            spaceAccelerated = false;
          }
        });

        play.addEventListener('click', (e) => {
          e.stopPropagation();
          togglePlay();
        });
        mute.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleMute();
        });

        vol.addEventListener('input', () => {
          video.volume = parseFloat(vol.value);
          video.muted = video.volume === 0;
          updateMuteUI();
          updateRangeFill(vol);
        });
        volWrap.addEventListener(
          'wheel',
          (e) => {
            e.preventDefault();
            const step = (e.deltaY < 0 ? 1 : -1) * 0.05;
            const v = Math.max(0, Math.min(1, (video.muted ? 0 : video.volume) + step));
            video.muted = v === 0;
            video.volume = v;
            vol.value = String(v);
            updateMuteUI();
            updateRangeFill(vol);
          },
          { passive: false },
        );

        menuBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          menu.classList.toggle('open');
        });
        document.addEventListener('click', (e) => {
          if (!e.target.closest('.menu')) menu.classList.remove('open');
        });

        rateSlider.addEventListener('input', () => {
          setRate(parseFloat(rateSlider.value));
          updateRangeFill(rateSlider);
        });
        loopOpt.addEventListener('click', () => {
          video.loop = !video.loop;
          loopVal.textContent = video.loop ? 'Вкл' : 'Выкл';
          showOSD('Повтор: ' + (video.loop ? 'Вкл' : 'Выкл'));
        });

        fs.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleFS();
        });
        pip.addEventListener('click', (e) => {
          e.stopPropagation();
          (async () => {
            try {
              if (document.pictureInPictureElement) await document.exitPictureInPicture();
              else if (document.pictureInPictureEnabled) await video.requestPictureInPicture();
            } catch {
              showOSD('PiP не поддерживается');
            }
          })();
        });

        player.addEventListener('mousemove', () => {
          if (!uiSuppressed()) showUI();
        });
        player.addEventListener('mouseleave', () => {
          scheduleHide();
        });

        if (poster) video.poster = poster;
        titleEl.textContent = title;

        video.volume = 1;
        vol.value = '1';
        updateMuteUI();
        updateRangeFill(vol);
        setRate(1);
        updateRangeFill(rateSlider);
        updatePlayButtons();
      })();
    </script>
  </body>
</html>
